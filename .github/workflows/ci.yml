name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # plugin-api workspace must emit dist/types before main tsc can
      # resolve @claude-in-mobile/plugin-api (3.11.1-class regression)
      - run: npm run build --workspace=packages/plugin-api
      - run: npx tsc --noEmit
      - run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # see comment in `test` job — workspace types required for tsc
      - run: npm run build --workspace=packages/plugin-api
      - run: npx tsc --noEmit

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cd cli && cargo test --lib

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # Fail the build on any HIGH or CRITICAL advisory affecting prod deps.
      # Dev-only advisories are reported but do not block (separate job below
      # surfaces them).
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit Rust dependencies
        # RUSTSEC-2026-0192: ttf-parser is flagged "unmaintained" (not an
        # exploitable vuln). It is a transitive dep via ab_glyph ->
        # owned_ttf_parser, used only for font rendering in screenshot
        # annotation; there is no fixed/maintained release to move to without
        # replacing ab_glyph. Ignored deliberately; revisit if ab_glyph adopts
        # a maintained parser. All actual vulnerabilities still fail the build.
        run: cd cli && cargo audit --deny warnings --ignore RUSTSEC-2026-0192
