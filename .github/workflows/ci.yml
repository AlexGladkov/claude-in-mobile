name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # FULL build (not just plugin-api): bootstrap.test dynamically imports the
      # @mcp-devices/plugin-* platform packages at runtime, which must have dist/
      # or the kernel loads zero platform plugins and those tests fail. The root
      # build script compiles plugin-api first (the 3.11.1-class tsc-resolution
      # fix), then tsc, then every platform workspace.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # see comment in `test` job — workspace types required for tsc
      - run: npm run build --workspace=packages/plugin-api
      - run: npx tsc --noEmit

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
      - run: cd cli && cargo test --locked --lib && cargo test --locked --test setup_grok && cargo test --locked --test repl_observability && cargo test --locked --test repl_live_tui && cargo test --locked --test harmony_cli

  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash ./gradlew test --no-daemon
        working-directory: desktop-companion

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile iOS debug daemon
        run: python3 -m py_compile packages/plugin-debug/bin/ios-debug-daemon.py

  swift-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Typecheck Swift helpers
        run: |
          swiftc -typecheck cli/assets/simwindow.swift
          swiftc -typecheck desktop-companion/src/main/resources/ax_click.swift
          swiftc -typecheck desktop-companion/src/main/resources/cgevent_helper.swift
          swiftc -typecheck desktop-companion/src/main/resources/windowlist.swift

  macos-rust-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
      - run: cargo check --locked
        working-directory: cli

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'
      # Fail the build on any HIGH or CRITICAL advisory affecting prod deps.
      # Dev-only advisories are reported but do not block (separate job below
      # surfaces them).
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit Rust dependencies
        run: cd cli && cargo audit --deny warnings
