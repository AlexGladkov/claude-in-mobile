name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      # FULL build (not just plugin-api): bootstrap.test dynamically imports the
      # @mcp-devices/plugin-* platform packages at runtime, which must have dist/
      # or the kernel loads zero platform plugins and those tests fail. The root
      # build script compiles plugin-api first (the 3.11.1-class tsc-resolution
      # fix), then tsc, then every platform workspace.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # see comment in `test` job — workspace types required for tsc
      - run: npm run build --workspace=packages/plugin-api
      - run: npx tsc --noEmit

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cd cli && cargo test --lib

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # Fail the build on any HIGH or CRITICAL advisory affecting prod deps.
      # Dev-only advisories are reported but do not block (separate job below
      # surfaces them).
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit Rust dependencies
        run: cd cli && cargo audit --deny warnings
