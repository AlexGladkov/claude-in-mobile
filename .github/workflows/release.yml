          EXPECTED_ASSETS_JSON="$(printf '%s\n' "${EXPECTED_ASSETS[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          ACTUAL_ASSETS_JSON="$(jq -c '[.assets[]?.name] | sort' <<<"$RELEASE_JSON")"
          if [[ "$ASSET_COUNT" -ne "${#EXPECTED_ASSETS[@]}" ||
            "$ARCHIVE_COUNT" -ne "${#EXPECTED_ARCHIVES[@]}" ||
            "$SIDECAR_COUNT" -ne "${#EXPECTED_ARCHIVES[@]}" ||
            "$ACTUAL_ASSETS_JSON" != "$EXPECTED_ASSETS_JSON" ]]; then
