name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# The archive matrix is the source of truth for release artifacts.
# Homebrew currently tracks the macOS targets; Linux archives are checked
# against their published SHA256 sidecars.
# Downstream jobs discover artifacts dynamically from upload-artifact filenames.

jobs:
  # Classifies the tag: a version with a prerelease component (e.g. 4.0.0-dev,
  # 4.0.0-rc.1) is published as a GitHub *pre-release* (does NOT become "Latest")
  # and to a non-`latest` npm dist-tag, so the stable 3.x line stays the default
  # install. Downstream jobs read these outputs instead of re-deriving them.
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      npm_tag: ${{ steps.classify.outputs.npm_tag }}
    steps:
      - name: Classify tag
        id: classify
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease: derive the npm dist-tag from the identifier
            # (4.0.0-dev -> dev, 4.0.0-rc.1 -> rc); fall back to `next`.
            NPM_TAG=$(echo "$VERSION" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-zA-Z][a-zA-Z0-9]*).*/\1/p')
            [ -z "$NPM_TAG" ] && NPM_TAG=next
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-latest
          - target: x86_64-apple-darwin
            platform: darwin-x86_64
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          ARCHIVE="claude-in-mobile-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz"
          BIN_DIR="cli/target/${{ matrix.target }}/release"
          ln -sf mcp-devices "$BIN_DIR/mcp-devices-cli"
          tar -czf "$ARCHIVE" -C "$BIN_DIR" mcp-devices mcp-devices-cli
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest packaged CLI archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "claude-in-mobile-*.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            claude-in-mobile-*.tar.gz
            claude-in-mobile-*.tar.gz.sha256

  verify-plugin-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json, marketplace.json, plugin.json match tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          FAIL=0
          COUNT=0
          # Guard against silently checking fewer fields than the release
          # profile promises (Stage 2 = 23). This is the 4.0.1 class: a new
          # manifest is added but the verify loop is not extended, CI stays
          # green on a stale subset, and channels desync. If you add or remove
          # a version field below, update EXPECTED to match.
          EXPECTED=23

          PKG=$(jq -r '.version' package.json)
          MARKET=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          GROK_MARKET=$(jq -r '.plugins[0].version' .grok-plugin/marketplace.json)
          PLUGIN=$(jq -r '.version' cli/plugin/.claude-plugin/plugin.json)
          GROK_PLUGIN=$(jq -r '.version' cli/plugin/.grok-plugin/plugin.json)
          CARGO=$(grep '^version =' cli/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "Tag:                                   $TAG"
          echo "package.json:                          $PKG"
          echo "cli/Cargo.toml:                        $CARGO"
          echo ".claude-plugin/marketplace.json:       $MARKET"
          echo ".grok-plugin/marketplace.json:         $GROK_MARKET"
          echo "cli/plugin/.claude-plugin/plugin.json: $PLUGIN"
          echo "cli/plugin/.grok-plugin/plugin.json:   $GROK_PLUGIN"

          for KIND in PKG CARGO MARKET GROK_MARKET PLUGIN GROK_PLUGIN; do
            VAL=$(eval echo \$$KIND)
            COUNT=$((COUNT + 1))
            if [ "$VAL" != "$TAG" ]; then
              echo "::error::$KIND version ($VAL) does not match tag ($TAG)"
              FAIL=1
            fi
          done

          # Scoped platform plugins ship on the same version line as the tag
          # (plugin-api is deliberately excluded — independently versioned).
          for p in plugin-android plugin-ios plugin-web plugin-desktop plugin-aurora plugin-harmony plugin-debug plugin-all; do
            PV=$(jq -r '.version' "packages/$p/package.json")
            COUNT=$((COUNT + 1))
            echo "packages/$p:                           $PV"
            if [ "$PV" != "$TAG" ]; then
              echo "::error::@mcp-devices/$p version ($PV) does not match tag ($TAG)"
              FAIL=1
            fi
          done

          # Runtime plugin manifests are consumer-visible and must match their
          # package/product version. Keeping this separate from package.json
          # catches stale manifest metadata such as the 3.11.0 -> 4.2.0 drift.
          for f in \
            packages/plugin-android/src/index.ts \
            packages/plugin-ios/src/index.ts \
            packages/plugin-web/src/index.ts \
            packages/plugin-desktop/src/index.ts \
            packages/plugin-aurora/src/index.ts \
            packages/plugin-harmony/src/index.ts \
            packages/plugin-debug/src/plugin.ts \
            src/plugins/builtin-tools/index.ts \
            src/plugins/repl/index.ts; do
            RV=$(grep -m1 -E '^[[:space:]]*version: "[0-9]+\.[0-9]+\.[0-9]+"' "$f" | sed -E 's/.*"([^"]+)".*/\1/')
            COUNT=$((COUNT + 1))
            echo "$f runtime manifest:               $RV"
            if [ "$RV" != "$TAG" ]; then
              echo "::error::$f runtime manifest version ($RV) does not match tag ($TAG)"
              FAIL=1
            fi
          done

          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::Checked $COUNT version fields but expected $EXPECTED. A manifest was added or removed without updating this job (4.0.1 class). Update the verify loops and EXPECTED together."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Version drift detected. All version fields must equal the tag."
            exit 1
          fi
          echo "All $COUNT versions match tag $TAG"

  release:
    needs: [build, setup]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
          # Prerelease tags (e.g. 4.0.0-dev) are flagged as pre-release and are
          # NOT promoted to "Latest" — the stable line keeps that badge.
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.setup.outputs.prerelease == 'false' }}

  publish-npm:
    needs: [build, verify-plugin-versions, setup]
    runs-on: ubuntu-latest
    # `--provenance` on `npm publish` mints a Sigstore attestation linking
    # the published tarball to this exact workflow run. The npm CLI rejects
    # the publish unless the workflow has `id-token: write` granted.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm Trusted Publishing CLI
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.setup.outputs.npm_tag }}
        # OIDC trusted publishing replaces long-lived NPM_TOKEN credentials.
        # An already published version is left unchanged on a retry; the first
        # successful publish has already assigned its dist-tag.
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published — nothing to do"
          else
            npm publish --access public --provenance --tag "${NPM_TAG}"
          fi

      - name: Publish @mcp-devices/plugin-api
        # every platform plugin depend on. Versioned INDEPENDENTLY of the release
        # tag (its own semver), so it is published as-is and is a no-op when the
        # version is unchanged. Without it on the registry, `npm i mcp-devices`
        # 404s on its `@mcp-devices/plugin-api` dependency.
        working-directory: packages/plugin-api
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published — nothing to do"
          else
            npm publish --access public --provenance
          fi

      - name: Publish scoped platform plugins
        env:
          NPM_TAG: ${{ needs.setup.outputs.npm_tag }}
        # OIDC trusted publishing replaces the former long-lived NPM_TOKEN.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for p in plugin-android plugin-ios plugin-web plugin-desktop plugin-aurora plugin-harmony plugin-debug plugin-all; do
            dir="packages/$p"
            NAME=$(jq -r '.name' "$dir/package.json")
            VERSION=$(jq -r '.version' "$dir/package.json")
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$NAME version ($VERSION) does not match tag ($TAG_VERSION) — bump it before tagging"
              exit 1
            fi
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} already published — nothing to do"
            else
              ( cd "$dir" && npm publish --access public --provenance --tag "${NPM_TAG}" )
            fi
          done
      - name: Publish claude-in-mobile compat shim
        env:
          NPM_TAG: ${{ needs.setup.outputs.npm_tag }}
        # OIDC trusted publishing replaces the former long-lived NPM_TOKEN.
        working-directory: compat/claude-in-mobile
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v | .dependencies["mcp-devices"]=$v | .dependencies["@mcp-devices/plugin-all"]=$v' package.json > package.json.tmp
          mv package.json.tmp package.json
          if npm view "claude-in-mobile@${VERSION}" version >/dev/null 2>&1; then
            echo "claude-in-mobile@${VERSION} already published — nothing to do"
          else
            npm publish --access public --provenance --tag "${NPM_TAG}"
          fi

  update-homebrew:
    needs: [release, setup]
    runs-on: ubuntu-latest
    # Never bump the stable Homebrew formula to a prerelease — brew users on the
    # stable tap must not be jumped to a dev build. verify-checksums depends on
    # this job, so it is skipped for prereleases too.
    if: needs.setup.outputs.prerelease == 'false'
    # Publish only to the canonical unified tap. The retired per-product tap is
    # read-only for this token; keeping it in the matrix made otherwise healthy
    # releases red and prevented checksum verification.

    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Discover platforms and SHAs
        id: sha
        # Build a JSON map { "<platform>": "<sha>" } from the .sha256 files.
        # Downstream consumers (Formula update, verify-checksums) iterate over
        # this map instead of hardcoded arch names.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAP="{}"
          PLATFORMS=()
          for f in claude-in-mobile-${VERSION}-*.tar.gz.sha256; do
            BASE=$(basename "$f" .tar.gz.sha256)
            PLATFORM="${BASE#claude-in-mobile-${VERSION}-}"
            SHA=$(awk '{print $1}' "$f")
            MAP=$(echo "$MAP" | jq -c --arg p "$PLATFORM" --arg s "$SHA" '. + {($p): $s}')
            PLATFORMS+=("$PLATFORM")
          done
          # jq -c keeps MAP single-line: GITHUB_OUTPUT rejects multiline values
          echo "map=$MAP" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS[*]}" >> "$GITHUB_OUTPUT"
          echo "Discovered platforms: ${PLATFORMS[*]}"
          echo "Map: $MAP"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AlexGladkov/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        working-directory: homebrew-tap
        env:
          SHA_MAP: ${{ steps.sha.outputs.map }}
          VERSION: ${{ steps.version.outputs.version }}
          FORMULA: mcp-devices.rb
        run: |
          python3 - <<'PYTHON'
          import json, os, re

          version = os.environ["VERSION"]
          sha_map = json.loads(os.environ["SHA_MAP"])
          # The canonical unified tap keeps the formula at the repo root. The
          # file is seeded out-of-band; this job patches version + shas in place.
          path = os.environ["FORMULA"]

          with open(path) as f:
              content = f.read()

          content = re.sub(r'version ".*?"', f'version "{version}"', content)
          # `oldname`/`oldnames` are not supported Formula DSL. Same-tap renames
          # use formula_renames.json; this product moved across taps, so retain
          # command aliases but strip the invalid migration directive.
          content = re.sub(r'^\s*oldnames?\s+.*\n?', '', content, flags=re.MULTILINE)

          # Homebrew tracks only macOS archives. Linux is released separately
          # and verified against its published SHA256 sidecar.
          shas = [sha_map[p] for p in sorted(sha_map) if p.startswith("darwin-")]
          sha_iter = iter(shas)
          def replace_sha(m):
              try:
                  return f'sha256 "{next(sha_iter)}"'
              except StopIteration:
                  return m.group(0)
          content = re.sub(r'sha256 "[a-f0-9]{64}"', replace_sha, content)

          # npm and the native CLI both historically installed `mcp-devices`.
          # Keep the native surface reachable through an unambiguous alias even
          # when npm shadows the Homebrew executable on PATH.
          install_line = '    bin.install "mcp-devices"'
          alias_line = '    bin.install_symlink bin/"mcp-devices" => "mcp-devices-cli"'
          if alias_line not in content:
              if install_line not in content:
                  raise RuntimeError(f"{path}: missing native CLI install line")
              content = content.replace(
                  install_line,
                  f"{install_line}\n{alias_line}",
                  1,
              )

          test_line = '    system "#{bin}/mcp-devices", "--version"'
          alias_test_line = '    system "#{bin}/mcp-devices-cli", "--version"'
          if alias_test_line not in content:
              if test_line not in content:
                  raise RuntimeError(f"{path}: missing native CLI test line")
              content = content.replace(
                  test_line,
                  f"{test_line}\n{alias_test_line}",
                  1,
              )

          with open(path, "w") as f:
              f.write(content)
          PYTHON

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "mcp-devices.rb"
          git diff --cached --quiet && exit 0
          git commit -m "Update mcp-devices to ${{ steps.version.outputs.version }}"
          git push

  verify-checksums:
    needs: update-homebrew
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and verify checksums
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        # Every archive must match its published SHA256 sidecar. macOS archives
        # must also match the Homebrew formula; Linux is distributed separately.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="AlexGladkov/claude-in-mobile"
          TAP_REPO="AlexGladkov/homebrew-tap"
          FAILED=0

          echo "::group::Fetching formula from tap"
          gh api "repos/${TAP_REPO}/contents/mcp-devices.rb" --jq '.content' | base64 -d > formula.rb
          cat formula.rb
          echo "::endgroup::"

          ASSETS=$(gh api "repos/${REPO}/releases/tags/v${VERSION}" \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | .name')

          if [ -z "$ASSETS" ]; then
            echo "::error::No tar.gz assets found in release v${VERSION}"
            exit 1
          fi

          while IFS= read -r ASSET; do
            URL="https://github.com/${REPO}/releases/download/v${VERSION}/${ASSET}"
            echo "::group::Verifying ${ASSET}"
            echo "Downloading ${URL}"
            curl -fsSL -o "${ASSET}" "${URL}"
            curl -fsSL -o "${ASSET}.sha256" "${URL}.sha256"

            ACTUAL=$(shasum -a 256 "${ASSET}" | awk '{print $1}')
            EXPECTED=$(awk 'NR == 1 { print $1 }' "${ASSET}.sha256")
            echo "Actual SHA256: ${ACTUAL}"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Checksum mismatch for ${ASSET}.sha256"
              FAILED=1
            else
              echo "Checksum verified against the published sidecar"
            fi

            if [[ "$ASSET" == *-linux-*.tar.gz ]]; then
              echo "Linux archive is not managed by the Homebrew formula"
            elif grep -Fq -- "${ACTUAL}" formula.rb; then
              echo "Checksum verified against the Homebrew formula"
            else
              echo "::error::Checksum mismatch for ${ASSET}! Formula does not contain ${ACTUAL}"
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "$ASSETS"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Release archive checksums do not match their sidecars or the Homebrew formula."
            echo "::error::Check whether release archives were replaced after build or upload."
            exit 1
          fi

          echo "All checksums verified successfully"
