          SIDECAR_COUNT="$(jq '[.assets[] | select(.name | endswith(".tar.gz.sha256"))] | length' <<<"$RELEASE_JSON")"
          ASSET_COUNT="$(jq '.assets | length' <<<"$RELEASE_JSON")"
