              [.assets[]?.name |
                select(. as $name | ($expected | index($name)) == null)] |
              sort | .[]
            ' <<<"$RELEASE_JSON")"
            echo "::error::Public prerelease must contain exactly the expected archive and checksum sidecar set"
            if [[ -n "$UNEXPECTED_ASSETS" ]]; then
              echo "::error::Unexpected public asset names:"
              while IFS= read -r name; do
                printf '::error::  %s\n' "$name"
              done <<<"$UNEXPECTED_ASSETS"
            fi
            echo "::error::Observed public asset names:"
            jq -r '.assets[]?.name' <<<"$RELEASE_JSON" | while IFS= read -r name; do
              printf '::error::  %s\n' "$name"
            done
            exit 1
          fi
          for ASSET in "${EXPECTED_ARCHIVES[@]}"; do
            ASSET_ID="$(jq -er --arg name "$ASSET" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("asset missing or duplicated") end
            ' <<<"$RELEASE_JSON")"
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/${REPO}/releases/assets/${ASSET_ID}" > "$ASSET_ID.archive"
            [[ -s "$ASSET_ID.archive" ]] || {
              echo "::error::Public prerelease asset ${ASSET} is empty"
              exit 1
            }
            ACTUAL="$(shasum -a 256 "$ASSET_ID.archive" | awk '{print $1}')"
            if ! ATTESTATION_JSON="$(gh attestation verify "$ASSET_ID.archive" \
              --repo "$REPO" \
              --signer-workflow "${REPO}/.github/workflows/release.yml" \
              --source-digest "$COMMIT_SHA" \
              --source-ref "refs/tags/${TAG_NAME}" \
              --format json)"; then
              echo "::error::No verified GitHub attestation for public prerelease ${ASSET}"
              exit 1
            fi
            if ! jq -e --arg name "$ASSET" --arg digest "$ACTUAL" '
              [
                .[]?.verificationResult.statement? |
                select(.predicateType == "https://slsa.dev/provenance/v1") |
                .subject[]? |
                select((.name // "") == $name and (.digest.sha256 // "") == $digest)
              ] | length > 0
            ' <<<"$ATTESTATION_JSON" >/dev/null; then
              echo "::error::Verified attestation subject does not bind ${ASSET} to ${ACTUAL}"
              exit 1
            fi
            # Secondary consumer-contract check; attestation above is the
            # archive trust root.
            SIDECAR_NAME="${ASSET}.sha256"
            SIDECAR_ID="$(jq -er --arg name "$SIDECAR_NAME" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].id else error("checksum sidecar missing or duplicated") end
            ' <<<"$RELEASE_JSON")"
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/${REPO}/releases/assets/${SIDECAR_ID}" > "$SIDECAR_ID.sidecar"
            [[ "$(wc -l < "$SIDECAR_ID.sidecar")" -eq 1 ]] || {
              echo "::error::Checksum sidecar must contain one record: ${SIDECAR_NAME}"
              exit 1
            }
            SIDECAR_RECORD="$(<"$SIDECAR_ID.sidecar")"
            if [[ "$SIDECAR_RECORD" != "${ACTUAL}  ${ASSET}" ]]; then
              echo "::error::Checksum sidecar does not match attested ${ASSET}"
              exit 1
            fi
            echo "Verified checksum consumer record for ${ASSET}"
            echo "Verified ${ASSET} against its immutable asset bytes and GitHub attestation"
          done

  # Always report a failed gate explicitly. Expected skipped jobs are channel
  # dependent: stable skips prerelease checksum verification; prerelease skips
  # Homebrew mutation.
  release-status:
    needs: [setup, ci-check, build, verify-plugin-versions, npm-build, attest, release, npm-token-preflight, npm-trusted-publisher-preflight, github-immutable-preflight, homebrew-token-preflight, release-preflight, publish-npm, repair-npm-tags, npm-smoke, finalize-release, update-homebrew, verify-checksums]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SETUP_RESULT: ${{ needs.setup.result }}
      CI_RESULT: ${{ needs.ci-check.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      VERSIONS_RESULT: ${{ needs.verify-plugin-versions.result }}
      NPM_BUILD_RESULT: ${{ needs.npm-build.result }}
      ATTEST_RESULT: ${{ needs.attest.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      NPM_RESULT: ${{ needs.publish-npm.result }}
      TOKEN_PREFLIGHT_RESULT: ${{ needs.npm-token-preflight.result }}
      TRUSTED_PUBLISHER_RESULT: ${{ needs.npm-trusted-publisher-preflight.result }}
      IMMUTABLE_PREFLIGHT_RESULT: ${{ needs.github-immutable-preflight.result }}
      HOMEBREW_PREFLIGHT_RESULT: ${{ needs.homebrew-token-preflight.result }}
      PREFLIGHT_RESULT: ${{ needs.release-preflight.result }}
      REPAIR_RESULT: ${{ needs.repair-npm-tags.result }}
      NPM_SMOKE_RESULT: ${{ needs.npm-smoke.result }}
      FINALIZE_RESULT: ${{ needs.finalize-release.result }}
      HOMEBREW_RESULT: ${{ needs.update-homebrew.result }}
      CHECKSUM_RESULT: ${{ needs.verify-checksums.result }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
    steps:
      - name: Enforce release gates
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          for pair in \
            "setup:$SETUP_RESULT" \
            "ci-check:$CI_RESULT" \
            "build:$BUILD_RESULT" \
            "verify-plugin-versions:$VERSIONS_RESULT" \
            "npm-build:$NPM_BUILD_RESULT" \
            "attest:$ATTEST_RESULT" \
            "release:$RELEASE_RESULT" \
            "publish-npm:$NPM_RESULT" \
            "npm-token-preflight:$TOKEN_PREFLIGHT_RESULT" \
            "npm-trusted-publisher-preflight:$TRUSTED_PUBLISHER_RESULT" \
            "github-immutable-preflight:$IMMUTABLE_PREFLIGHT_RESULT" \
            "release-preflight:$PREFLIGHT_RESULT" \
            "npm-smoke:$NPM_SMOKE_RESULT" \
            "finalize-release:$FINALIZE_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != success ]]; then
              echo "::error::Required release job $name ended with $result"
              FAIL=1
            fi
          done
          if [[ "$REPAIR_RESULT" != success && "$REPAIR_RESULT" != skipped ]]; then
            echo "::error::npm dist-tag repair job ended with $REPAIR_RESULT"
            FAIL=1
          fi
          if [[ "$PRERELEASE" == false ]]; then
            if [[ "$HOMEBREW_PREFLIGHT_RESULT" != success ]]; then
              echo "::error::Stable release requires successful Homebrew token preflight"
              FAIL=1
            fi
          elif [[ "$PRERELEASE" == true ]]; then
            if [[ "$HOMEBREW_PREFLIGHT_RESULT" != skipped ]]; then
              echo "::error::Prerelease must skip the stable-only Homebrew token preflight"
              FAIL=1
            fi
          fi

          if [[ "$PRERELEASE" == false ]]; then
            if [[ "$HOMEBREW_RESULT" != success ]]; then
              echo "::error::Stable release requires successful Homebrew update/check"
              FAIL=1
            fi
            if [[ "$CHECKSUM_RESULT" != skipped ]]; then
              echo "::error::Stable release must skip prerelease checksum job"
              FAIL=1
            fi
          elif [[ "$PRERELEASE" == true ]]; then
            if [[ "$HOMEBREW_RESULT" != skipped ]]; then
              echo "::error::Prerelease must skip Homebrew mutation"
              FAIL=1
            fi
            if [[ "$CHECKSUM_RESULT" != success ]]; then
              echo "::error::Prerelease requires successful checksum verification"
              FAIL=1
            fi
          else
            echo "::error::Tag classification did not produce a stable/prerelease result"
            FAIL=1
          fi

          if [[ "$FAIL" -ne 0 ]]; then
            echo "::error::Release gate failed; no silent partial release is accepted"
            exit 1
          fi
          echo "All release gates passed"
