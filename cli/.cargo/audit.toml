# cargo-audit policy. Each ignore must carry a justification and an owner
# review date. Remove entries as upstream fixes land.

[advisories]
ignore = [
  # rsa 0.9.x — Marvin timing side-channel (key recovery). No fixed release
  # exists upstream. Usage here: signing Google Play API JWTs with our own
  # service-account key in a local CLI process — no remote attacker-timed
  # decryption oracle, so the practical risk is negligible. Re-check on every
  # release: https://rustsec.org/advisories/RUSTSEC-2023-0071
  "RUSTSEC-2023-0071",

  # ttf-parser is unmaintained but has no vulnerability advisory and no
  # maintained replacement in ab_glyph/imageproc. It parses one embedded,
  # build-time font asset; no untrusted fonts reach it.
  "RUSTSEC-2026-0192",

  # paste is an unmaintained compile-time proc macro pulled through
  # imageproc -> nalgebra -> simba. It has no vulnerability advisory, ships no
  # runtime code, and processes no untrusted input. Re-check on every release:
  # https://rustsec.org/advisories/RUSTSEC-2024-0436
  "RUSTSEC-2024-0436",
]

# No yanked dependencies are permitted.
[yanked]
enabled = true
