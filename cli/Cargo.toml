[package]
name = "mcp-devices"
version = "4.4.1"
edition = "2021"
description = "Fast native CLI for mobile device automation (Android/iOS/HarmonyOS/Aurora/Desktop)"
authors = ["defendend", "Alex Gladkov"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.26", default-features = false, features = ["text"] }
ab_glyph = "0.2"
base64 = "0.22"
colored = "2.0"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls"], default-features = false }
rsa = { version = "0.9", features = ["pem", "sha2"] }
portable-pty = "0.9"
vt100 = "0.15"
tempfile = "3"
wait-timeout = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
